# =============================================================================
# Tsetlin Machine Prefetcher Configuration (P1.2/P1.3 tuned)
# =============================================================================
# This file contains all tunable parameters for the Tsetlin Machine prefetcher.
# To use this configuration, either:
#   1. Include it from your main config: add "config = config/tsetlin.ini"
#   2. Pass parameters directly via command line: --tsetlin_num_clauses=128
#
# Hardware storage estimate for P1.3 config (80 features):
#   TA state table: 128 clauses * 80 features * 2 automata * 4 bits = 10 KB
#   Clause metadata: 128 clauses * 2 bytes = 256 bytes
#   Working arrays: ~1.3 KB
#   PT overhead: 512 entries * ~14 bytes = 7 KB
#   Total: ~18.5 KB (within hardware budget)
# =============================================================================

# ---- Tsetlin Machine Core Parameters ----

# Number of clauses across all actions (must be divisible by num_actions)
# More clauses = more patterns can be learned, but higher storage cost
tsetlin_num_clauses = 128

# Number of binary input features generated from program state
# P1.3: increased 64→80 to accommodate delta signature bits (P1.3) and headroom.
tsetlin_num_features = 80

# Number of action classes (prefetch offsets + no-prefetch action)
# Automatically set from the action list; this is a max bound
tsetlin_num_actions = 15

# Number of states per Tsetlin Automaton half
# Total states = 2 * num_states (upper half = INCLUDE, lower half = EXCLUDE)
# Default: 8 → 16 total states (4-bit saturating counter per TA)
tsetlin_num_states = 8

# Precision parameter s (controls pattern specificity)
# Higher s → more specific patterns (slower to learn, higher precision)
# Lower s → more general patterns (faster to learn, lower precision)
# Typical range: 1.5 - 10.0
tsetlin_s = 3.0

# Voting threshold T (controls resource allocation sensitivity)
# Higher T → more clauses can fire simultaneously before feedback stops
# Typical range: 2 - 16
tsetlin_threshold = 8

# RNG seed for TA initialization and stochastic operations
tsetlin_seed = 42

# ---- Action Space ----
# List of prefetch offset deltas to consider
# Positive = forward prefetch, Negative = backward prefetch, 0 = no prefetch
tsetlin_actions = 1,3,4,5,10,11,12,22,23,30,32,-1,-3,-6,0

# ---- Feature Encoding (P1.2) ----
# Bit allocation for the hybrid encoding scheme. Total must sum to
# <= tsetlin_num_features (remaining bits go to hash encoding).

# Thermometer bits for delta magnitude [0, 63]. P1.2: increased 8→12
# for finer stride resolution (e.g., distinguishing +3 from +4).
tsetlin_temp_delta_bits = 12

# PC×Page interaction hash bits (NEW in P1.2).
# Captures joint (PC, page) identity — the #1 missing feature vs LinUCB.
# Set to 0 to disable.
tsetlin_interaction_bits = 4

# Thermometer bits for BW level (NEW in P1.2).
# Independent encoding so the TM can learn BW-aware rules.
# DRAM_BW_LEVELS=4, so 2 bits covers all 4 levels. Set to 0 to disable.
tsetlin_temp_bw_bits = 2

# Delta signature bitwise encoding bits (NEW in P1.3).
# 12-bit SPP-style shift-XOR hash of the last 4 deltas, encoded bitwise
# (each bit is an independent binary feature).  Since delta signatures are
# hash values with NO ordinal semantics, bitwise is the correct encoding —
# thermometer encoding would be semantically meaningless here.
# Set to 0 to disable.  Max: 12 (constrained by DELTA_SIG_BIT=12).
tsetlin_delta_sig_bits = 12

# ---- Second-order reasoning features (P1.4) ----
# These are DISABLED BY DEFAULT (set to 0).  To enable, set to 4-8 and
# increase tsetlin_num_features accordingly (e.g., +4 per enabled feature).

# Access frequency thermometer bits (P1.4 NEW).
# Per-page saturating access counter (0..255), thermometer-encoded.
# Enables the TM to learn page-hotness-aware rules.
# 0 = disabled.  Recommended: 4 if enabled.
tsetlin_freq_bits = 0

# Confidence feedback thermometer bits (P1.4 NEW).
# Vote margin from the TM's last prediction on this page, fed back as input.
# Enables "second-order reasoning": the TM can learn rules conditioned on
# its own certainty.  0 = disabled.  Recommended: 4 if enabled.
# If enabled, increase tsetlin_num_features by tsetlin_freq_bits + tsetlin_conf_bits.
tsetlin_conf_bits = 0

# ---- Prefetch Tracker Parameters ----

# Size of the Prefetch Tracker (PT) - tracks issued prefetches for reward
# Larger = can track more in-flight prefetches, but more storage
# P0: increased 256→512 to reduce premature eviction.
tsetlin_pt_size = 512

# Number of prefetch addresses to generate per decision
# When dynamic degree is disabled, this is the fixed degree
# When dynamic degree is enabled, this is the max allowed degree
tsetlin_pref_degree = 1

# ---- Dynamic Prefetch Degree (P1.1: margin-based) ----

# Enable dynamic prefetch degree based on TM vote MARGIN
# 0 = disabled (use fixed tsetlin_pref_degree), 1 = enabled
tsetlin_enable_dyn_degree = 1

# P1.1: Confidence = class_sum[best] - class_sum[second_best] (margin).
# Margin range: [0, 2T] = [0, 16] for default T=8.
# Higher margin → clearer winner → more confidence → higher degree.
# Thresholds scaled ~2× from the old absolute-class_sum scheme.

# Normal-BW thresholds (margin-based)
tsetlin_dyn_deg_thresh = 2,6,9
tsetlin_dyn_deg_values = 2,2,4,6

# High-BW variants (more conservative to avoid wasting scarce bandwidth)
tsetlin_dyn_deg_thresh_hbw = 2,6,9
tsetlin_dyn_deg_values_hbw = 1,2,2,4

# ---- Exploration/Exploitation (P2.2: annealing) ----

# Epsilon for epsilon-greedy exploration (floor after warmup)
# 0.005 = 0.5% random exploration → mostly exploit
tsetlin_epsilon = 0.005

# Initial epsilon during warmup phase (P2.2).
# Higher initial exploration helps escape the cold-start trap where
# negative feedback dominates (38K negative vs 14K positive).
tsetlin_epsilon_init = 0.05

# Number of invocations over which epsilon linearly decays from
# epsilon_init to epsilon (P2.2). 100K ≈ 1-2M cycles.
tsetlin_warmup_invocations = 100000

# ---- System Awareness ----

# DRAM bandwidth level threshold for "high bandwidth" state
# DRAM_BW_LEVELS = 4, so threshold of 3 means bw_level >= 3 → high BW
tsetlin_high_bw_thresh = 3

# RNG seed for the prefetcher (exploration decisions)
tsetlin_rng_seed = 42
