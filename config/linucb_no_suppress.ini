# =============================================================================
# Contextual Bandit (LinUCB) Prefetcher Configuration (P1.3)
# =============================================================================
# This file contains all tunable parameters for the LinUCB contextual bandit
# prefetcher. To use this configuration, either:
#   1. Include it from your main config: add "config = config/linucb.ini"
#   2. Pass parameters directly via command line: --linucb_alpha=1.5
#
# Hardware storage estimate for P1.3 config (9 features):
#   A_inv matrices: 15 actions × 9×9 floats × 4 bytes = 4.86 KB
#   theta vectors:  15 actions × 9 floats × 4 bytes = 0.54 KB
#   b vectors:      15 actions × 9 floats × 4 bytes = 0.54 KB
#   PT overhead:    256 entries × ~18 bytes = 4.5 KB
#   Total: ~10.4 KB (within hardware budget, ~2.5× less than Pythia's 25.5 KB)
# =============================================================================

# ---- LinUCB Core Parameters ----

# Number of action classes (prefetch offsets + no-prefetch action)
# Automatically set from the action list; this is a max bound
linucb_num_actions = 15

# Dimensionality of the context (feature) vector
# Each feature is a real-valued scalar encoding program state:
#   [0] PC hash, [1] Page hash, [2] Offset, [3] Delta,
#   [4] Delta sign, [5] BW level, [6] PC×Page interaction,
#   [7] Offset×Delta interaction,
#   [8] Delta signature (P1.3) — 12-bit shift-XOR hash of last 4 deltas
#   [9] Access frequency (P1.4) — saturating counter / 255
#   [10] Confidence feedback (P1.4) — |expected_reward|
#
# P1.6: parameters re-tuned for 11-feature stability.
# The previous values (alpha=5.0, lambda=0.1, epsilon=0.01) were tuned
# on a single trace (mcf) with only 8 features.  With 11 features the
# A_inv matrix is nearly 2× larger and needs more conservative
# regularization to avoid numerical instability during Sherman-Morrison
# updates.  The P1.6 adaptive-aggressiveness fix also reduces the need
# for extreme exploration (alpha=5.0) by handling negative cycles
# through soft probabilistic suppression rather than hard cutoff.
# P2.6: when history_features is enabled, num_features must be >= 14:
#   14 = 11 baseline + stride_streak + 2 history
#   15 = 11 baseline + stride_streak + delta_var_ema + 2 history
linucb_num_features = 14

# Exploration parameter alpha (UCB bonus weight)
# Higher alpha → more exploration (wider confidence intervals)
# Lower alpha → more exploitation (greedier)
# Typical range: 0.1 - 5.0
# P1.6: 2.0 — moderate exploration, balanced for 11d features
linucb_alpha = 2.0

# L2 regularization parameter lambda (ridge regression)
# Higher lambda → stronger regularization (more conservative updates)
# Lower lambda → more aggressive fitting to recent data
# A_inv is initialized to (1/lambda) * I
# Typical range: 0.1 - 10.0
# P1.6: 0.5 — middle ground, provides numerical stability for 11×11 A_inv
linucb_lambda = 0.5

# RNG seed for LinUCB initialization
linucb_seed = 42

# ---- Action Space ----
# List of prefetch offset deltas to consider
# Positive = forward prefetch, Negative = backward prefetch, 0 = no prefetch
# Same as Pythia's default action set
linucb_actions = 1,3,4,5,10,11,12,22,23,30,32,-1,-3,-6,0

# ---- Prefetch Tracker Parameters ----

# Size of the Prefetch Tracker (PT)
# Tracks issued prefetches for delayed reward assignment
# Larger = can track more in-flight prefetches, but more storage
# IMPORTANT: when enabling dynamic degree, the PT fill rate increases
# proportionally to the average degree.  Consider 512 or 1024 when running
# with degree=4 or degree=6 to avoid premature eviction (which lowers the
# effective PT hit rate and starves the bandit of learning feedback).
linucb_pt_size = 512

# Number of prefetch addresses to generate per decision
# When dynamic degree is disabled, this is the fixed degree
# When dynamic degree is enabled, this is the max allowed degree
linucb_pref_degree = 1

# ---- Dynamic Prefetch Degree ----
# Enable dynamic prefetch degree based on LinUCB expected reward confidence
# 0 = disabled (use fixed linucb_pref_degree), 1 = enabled
linucb_enable_dyn_degree = 1

# Confidence thresholds for degree selection (expected_reward * 100, range [0, ~100])
# Lower = less confident → lower degree. Sorted ascending.
# Default: conf <= 0.10 → deg 1, <= 0.30 → deg 2, <= 0.60 → deg 4, > 0.60 → deg 6
linucb_dyn_deg_thresh = 10,30,60
linucb_dyn_deg_values = 1,2,4,6

# High-BW variants (more conservative to avoid wasting scarce bandwidth)
linucb_dyn_deg_thresh_hbw = 10,30,60
linucb_dyn_deg_values_hbw = 1,1,2,4

# ---- Exploration/Exploitation ----

# Epsilon for epsilon-greedy exploration (on top of LinUCB's native UCB exploration)
# 0.005 = 0.5% random exploration
# This provides an additional safety net beyond LinUCB's built-in UCB exploration.
# P1.6: restored to 0.005 (0.5%).  ε-greedy probes are now also the escape
# mechanism for adaptive-aggressiveness suppression (P1.6(c)), so we keep
# this moderate — just enough to break deadlocks, not enough to hurt IPC.
linucb_epsilon = 0.005

# ---- System Awareness ----

# DRAM bandwidth level threshold for "high bandwidth" state
# DRAM_BW_LEVELS = 4, so threshold of 3 means bw_level >= 3 → high BW
# High BW → more aggressive penalization of incorrect prefetches
linucb_high_bw_thresh = 3

# RNG seed for the prefetcher (exploration decisions)
linucb_rng_seed = 42

# ---- Feature-wise LinUCB decomposition (P2.3) ----
# 0 = monolithic (single LinUCB with all features, default)
# 1 = feature-wise (multiple small LinUCB models per feature group)
# When enabled, separate models are created for PC, Page, Offset, Delta,
# BW, Interaction, Context, and optionally History features.
# Total storage is similar because sum(d_i^2) < D^2 for D > 1.
linucb_featurewise = 1

# Pooling strategy for feature-wise LinUCB:
#   0 = weighted sum (weights learned via EMA of correctness)
#   1 = max pooling
linucb_featurewise_pooling = 0

# EMA decay for sub-model weight learning (P2.3).
# 0.01 means 1% update per training step. Set to 0 to disable weight learning.
linucb_featurewise_weight_lr = 0.01

# ---- UCB score ratio gating (P2.5) ----
# Suppress prefetch when the best UCB score is not significantly better than
# the average — all actions have similar scores, no clear winner.
# 0 = off (default), 1 = on
linucb_suppress_gating = 0

# Threshold for best_score / avg_score ratio.
# Lower = more aggressive suppression. 1.5 means best must be 50% above avg.
# Typical range: 1.2 - 2.0.
linucb_suppress_ratio = 1.5

# ---- Path/history features (P2.6) ----
# 0 = off (default), 1 = on. Adds 2 features at the end of the feature vector:
#   [num_features-2]: hash of recent PCs
#   [num_features-1]: hash of recent deltas
# When enabled, increase linucb_num_features to at least 14 to avoid
# overwriting stride_streak (index 11).
# Recommended layouts:
#   14 = 11 baseline + stride_streak + 2 history
#   15 = 11 baseline + stride_streak + delta_var_ema + 2 history
linucb_history_features = 1
