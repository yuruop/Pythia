# =============================================================================
# Meta-Selector Prefetcher Configuration
# =============================================================================
# Layer 2 of the multi-layer adaptive prefetching system.
#
# Runs three base prefetchers simultaneously (Tsetlin, LinUCB, Stride) and
# selects the most confident one's predictions on each access.
#
# To use this configuration:
#   ./build_champsim.sh no meta_selector no 1
# Then run with: --config=config/meta_selector.ini
#
# This file includes the sub-prefetcher configs and adds meta-selector-specific
# parameters. It reuses the Tsetlin and LinUCB knob namespaces.
# =============================================================================

# ---- Meta-Selector Specific Parameters ----

# EMA decay factor for confidence normalization.
# Lower = slower adaptation (more stable), Higher = faster adaptation (more responsive).
# 0.01 means ~1% update per invocation → adapts over ~100 samples.
meta_selector_conf_alpha = 0.01

# Meta-level epsilon-greedy exploration rate.
# With this probability, a random prefetcher is selected regardless of confidence.
# Prevents training starvation: non-winners get occasional fill-feedback.
# 0.05 = 5% random selection (default).  Set to 0.0 to disable.
meta_selector_epsilon = 0.05

# RNG seed for the meta-selector (tie-breaking / exploration, distinct from sub-prefetchers).
meta_selector_rng_seed = 42

# =============================================================================
# Sub-Prefetcher Configurations
# =============================================================================

# ---- Tsetlin Machine Parameters ----
tsetlin_num_clauses = 128
tsetlin_num_features = 111
tsetlin_num_actions = 15
tsetlin_num_states = 8
tsetlin_s = 10.0
tsetlin_threshold = 8
tsetlin_seed = 42
tsetlin_actions = 1,3,4,5,10,11,12,22,23,30,32,-1,-3,-6,0
tsetlin_temp_delta_bits = 12
tsetlin_interaction_bits = 4
tsetlin_temp_bw_bits = 2
tsetlin_delta_sig_bits = 12
tsetlin_freq_bits = 4
tsetlin_conf_bits = 4
tsetlin_pt_size = 512
tsetlin_pref_degree = 1
tsetlin_enable_dyn_degree = 1
tsetlin_dyn_deg_thresh = 2,6,9
tsetlin_dyn_deg_values = 2,2,4,6
tsetlin_dyn_deg_thresh_hbw = 2,6,9
tsetlin_dyn_deg_values_hbw = 1,2,2,4
tsetlin_epsilon = 0.01
tsetlin_epsilon_init = 0.05
tsetlin_warmup_invocations = 100000
tsetlin_high_bw_thresh = 3
tsetlin_rng_seed = 42
tsetlin_featurewise = 1
tsetlin_pooling = 0
tsetlin_tm_weight_lr = 0.01
tsetlin_encoding = 1
tsetlin_num_tilings = 4
tsetlin_tiles_per_tiling = 16

# ---- LinUCB Parameters ----
linucb_num_actions = 15
linucb_num_features = 14
linucb_alpha = 2.0
linucb_lambda = 0.5
linucb_seed = 42
linucb_actions = 1,3,4,5,10,11,12,22,23,30,32,-1,-3,-6,0
linucb_pt_size = 512
linucb_pref_degree = 1
linucb_enable_dyn_degree = 1
linucb_dyn_deg_thresh = 10,30,60
linucb_dyn_deg_values = 1,2,4,6
linucb_dyn_deg_thresh_hbw = 10,30,60
linucb_dyn_deg_values_hbw = 1,1,2,4
