# =============================================================================
# Meta-Selector Prefetcher Configuration
# =============================================================================
# Layer 2 of the multi-layer adaptive prefetching system.
#
# Runs three base prefetchers simultaneously (Tsetlin, LinUCB, Stride) and
# selects the best one's predictions on each access.
#
# Selection strategy (v2):
#   - P4: UCB on actual prefetch accuracy (PT hit rate) for Tsetlin vs LinUCB
#   - P2: Stride restricted to fallback-only (when both ML have no predictions)
#   - P3: Faster EMA adaptation (alpha 0.01 → 0.1)
#   - P5: Context-aware blending via PC-indexed accuracy table
#
# To use this configuration:
#   ./build_champsim.sh no meta_selector no 1
# Then run with: --config=config/meta_selector.ini
# =============================================================================

# ---- Meta-Selector Specific Parameters ----

# EMA decay factor for confidence normalization (secondary signal).
# Higher = faster adaptation. 0.1 means ~10% update per invocation.
# (P3: increased from 0.01 for faster phase-change response)
meta_selector_conf_alpha = 0.1

# EMA decay factor for accuracy tracking (P4: primary selection signal).
# Controls how fast the UCB accuracy estimate adapts to recent performance.
# 0.1 = ~10 samples to mostly reflect new data.
meta_selector_accuracy_alpha = 0.1

# Meta-level epsilon-greedy exploration rate.
# With this probability, a random ML prefetcher is selected regardless of UCB.
# Reduced from 5% to 2% since UCB provides its own exploration bonus (P4).
# 0.02 = 2% random selection.  Set to 0.0 to disable.
meta_selector_epsilon = 0.02

# UCB exploration constant (P4).
# Higher = more exploration.  2.0 is standard for bounded rewards [0,1].
meta_selector_ucb_c = 2.0

# Number of invocations between accuracy sampling updates (P4).
# PT hit deltas are computed over this window and EMA-updated.
# 1000 provides a good balance between responsiveness and noise reduction.
meta_selector_sample_interval = 1000

# Context-vs-global blend factor for PC-indexed accuracy table (P5).
# 0.0 = use only global accuracy.  1.0 = use only context-specific accuracy.
# 0.5 = equal blend (default).
meta_selector_ctx_blend = 0.5

# RNG seed for the meta-selector (tie-breaking / exploration, distinct from sub-prefetchers).
meta_selector_rng_seed = 42

